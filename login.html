<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Web Design Competition</title>
  <meta name="description" content="Web Designing Competition - Participant Login">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="bg-animate"></div>
  <div class="login-wrapper">
    <div class="login-card glass fade-in">
      <div class="logo"><span>🎨 DesignArena</span></div>
      <p class="subtitle">Web Designing Competition Platform</p>

      <form id="login-form" onsubmit="handleLogin(event)">

        <div class="form-group">
          <label for="lotNumber">🎫 Lot Number</label>
          <input type="text" id="lotNumber" class="form-control" placeholder="e.g. LOT001" required autocomplete="off">
        </div>
        <div id="login-error" style="color:var(--danger);font-size:.85rem;margin-bottom:16px;display:none;padding:10px;background:rgba(239,68,68,.1);border-radius:8px;border:1px solid var(--danger)"></div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%">🚀 Enter Competition</button>
      </form>



      <div style="margin-top:16px;display:flex;justify-content:space-between;align-items:center">
        <div class="theme-toggle" onclick="toggleTheme()" title="Toggle theme"></div>
        <a href="admin/login.html" class="btn btn-secondary btn-sm">🔐 Admin</a>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('appTheme')||'dark'); })();
    function toggleTheme(){ const c=document.documentElement.getAttribute('data-theme'); const n=c==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',n); localStorage.setItem('appTheme',n); }
    function handleLogin(e){
      e.preventDefault();
      const lotNumber=document.getElementById('lotNumber').value.trim().toUpperCase();
      const result=Auth.loginParticipant(lotNumber);
      if(result.success){ 
        const settings = Storage.getSettings();
        if(settings && settings.eventEnded) {
            Auth.logoutParticipant();
            window.location.href='index.html';
        }
        else if(settings && settings.eventStarted) window.location.href='user-dashboard.html';
        else window.location.href='waiting.html';
      }
      else {
        const err=document.getElementById('login-error');
        err.textContent=result.message; err.style.display='block';
        document.getElementById('login-form').classList.add('shake');
        setTimeout(()=>document.getElementById('login-form').classList.remove('shake'),500);
      }
    }
    // Force fresh login whenever visiting this page
    if(Auth.isParticipantLoggedIn()) {
        Auth.logoutParticipant();
    }
  </script>
</body>
</html>
