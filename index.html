<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoftTech Association | Web Design Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: none;
    }

    /* ═══════════ CANVAS BACKGROUND ═══════════ */
    canvas#bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    /* ═══════════ CUSTOM CURSOR ═══════════ */
    .cursor-dot {
      width: 6px; height: 6px;
      background: #ff6b35;
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 10001;
      box-shadow: 0 0 10px #ff6b35, 0 0 20px #ff6b35;
      transition: transform 0.05s;
    }

    .cursor-ring {
      width: 36px; height: 36px;
      border: 1.5px solid rgba(255, 107, 53, 0.6);
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 10000;
      transition: width 0.4s, height 0.4s, border-color 0.3s, background 0.3s;
    }

    /* ═══════════ CONTENT ═══════════ */
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 35px;
    }

    /* ── Header Box ── */
    .header-box {
      border: 1px solid rgba(255, 107, 53, 0.25);
      padding: 18px 55px;
      position: relative;
      background: rgba(255, 107, 53, 0.03);
    }

    /* Corner accents */
    .header-box::before, .header-box::after {
      content: '';
      position: absolute;
      width: 12px; height: 12px;
      border-color: #ff6b35;
      border-style: solid;
    }
    .header-box::before {
      top: -1px; left: -1px;
      border-width: 2px 0 0 2px;
    }
    .header-box::after {
      bottom: -1px; right: -1px;
      border-width: 0 2px 2px 0;
    }

    .college-name {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 5px;
      color: #e8e8e8;
      text-transform: uppercase;
    }

    .dept-name {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 4px;
      color: #ff6b35;
      margin-top: 6px;
    }

    /* ── Main Title ── */
    .title-1 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 7.5rem;
      letter-spacing: 8px;
      line-height: 0.9;
      color: #ff6b35;
      text-shadow:
        0 0 10px rgba(255, 107, 53, 0.6),
        0 0 40px rgba(255, 107, 53, 0.3),
        0 0 80px rgba(255, 107, 53, 0.15);
      animation: titleGlow 4s ease-in-out infinite alternate;
    }

    .title-2 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 5rem;
      letter-spacing: 22px;
      color: #ffa94d;
      text-shadow:
        0 0 10px rgba(255, 169, 77, 0.5),
        0 0 30px rgba(255, 169, 77, 0.2);
      margin-top: 5px;
    }

    @keyframes titleGlow {
      0% { text-shadow: 0 0 10px rgba(255,107,53,0.6), 0 0 40px rgba(255,107,53,0.3); }
      100% { text-shadow: 0 0 20px rgba(255,107,53,0.8), 0 0 60px rgba(255,107,53,0.5), 0 0 100px rgba(255,107,53,0.2); }
    }

    /* ── Subtitle ── */
    .subtitle {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.15rem;
      letter-spacing: 10px;
      color: #888;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* ── CTA Button ── */
    .btn-cta {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: 5px;
      color: #ff6b35;
      background: transparent;
      border: 1px solid rgba(255, 107, 53, 0.4);
      padding: 16px 50px;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      transition: all 0.4s ease;
      display: inline-block;
    }

    .btn-cta::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,107,53,0.15), transparent);
      transition: left 0.5s ease;
    }

    .btn-cta:hover {
      background: rgba(255, 107, 53, 0.08);
      box-shadow: 0 0 25px rgba(255, 107, 53, 0.3), inset 0 0 10px rgba(255, 107, 53, 0.1);
      color: #fff;
    }

    .btn-cta:hover::before {
      left: 100%;
    }

    /* ── Footer ── */
    .footer {
      position: absolute;
      bottom: 22px;
      font-size: 0.7rem;
      color: #444;
      letter-spacing: 2px;
      z-index: 10;
      text-transform: uppercase;
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .title-1 { font-size: 4.5rem; letter-spacing: 4px; }
      .title-2 { font-size: 3rem; letter-spacing: 12px; }
      .header-box { padding: 14px 25px; }
      .college-name { font-size: 0.8rem; letter-spacing: 3px; }
      .subtitle { font-size: 0.9rem; letter-spacing: 5px; }
    }

    @media (max-width: 500px) {
      .title-1 { font-size: 3rem; }
      .title-2 { font-size: 2rem; letter-spacing: 8px; }
    }
  </style>
</head>
<body>

  <!-- Custom Cursor -->
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <!-- Background Canvas -->
  <canvas id="bg"></canvas>

  <!-- Main Content -->
  <div class="content">

    <div class="header-box">
      <div class="college-name">Ayya Nadar Janaki Ammal College</div>
      <div class="dept-name">Department of Computer Applications</div>
    </div>

    <div>
      <div class="title-1">SOFTTECH</div>
      <div class="title-2">ASSOCIATION</div>
    </div>

    <div class="subtitle">The Ultimate Web Design Challenge</div>

    <a href="login.html" class="btn-cta" id="ctaBtn">> START_SYSTEM</a>

  </div>

  <div class="footer">© 2026 Ayya Nadar Janaki Ammal College · Dept. of Computer Applications</div>

  <script>
  // ════════════════════════════════════════════
  //  CONSTELLATION BACKGROUND (Orange + Purple)
  // ════════════════════════════════════════════
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
  }
  addEventListener('resize', resize);
  resize();

  // Stars
  const STAR_COUNT = 120;
  const stars = [];
  const LINK_DIST = 160;

  class Star {
    constructor() {
      this.reset();
    }
    reset() {
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.vx = (Math.random() - 0.5) * 0.4;
      this.vy = (Math.random() - 0.5) * 0.4;
      this.r = Math.random() * 2 + 1;
      // Color palette: orange, amber, purple, coral
      const palettes = [
        [255, 107, 53],   // Burnt Orange
        [255, 169, 77],   // Amber
        [160, 80, 220],   // Purple
        [255, 130, 90],   // Coral
      ];
      this.c = palettes[Math.floor(Math.random() * palettes.length)];
      this.twinkle = Math.random() * Math.PI * 2;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.twinkle += 0.02;
      if (this.x < -10 || this.x > W + 10 || this.y < -10 || this.y > H + 10) {
        this.reset();
        // re-enter from an edge
        if (Math.random() > 0.5) { this.x = Math.random() > 0.5 ? -5 : W + 5; this.y = Math.random() * H; }
        else { this.y = Math.random() > 0.5 ? -5 : H + 5; this.x = Math.random() * W; }
      }
    }
    draw() {
      const alpha = 0.6 + 0.4 * Math.sin(this.twinkle);
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${this.c[0]},${this.c[1]},${this.c[2]},${alpha})`;
      ctx.shadowBlur = 12;
      ctx.shadowColor = `rgba(${this.c[0]},${this.c[1]},${this.c[2]},0.8)`;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  for (let i = 0; i < STAR_COUNT; i++) stars.push(new Star());

  // Mouse interaction
  let mx = -1000, my = -1000;
  addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

  function loop() {
    ctx.fillStyle = 'rgba(10, 10, 15, 0.15)';
    ctx.fillRect(0, 0, W, H);

    // Draw connecting lines
    for (let i = 0; i < stars.length; i++) {
      stars[i].update();
      stars[i].draw();
      for (let j = i + 1; j < stars.length; j++) {
        const dx = stars[i].x - stars[j].x;
        const dy = stars[i].y - stars[j].y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < LINK_DIST) {
          const alpha = (1 - d / LINK_DIST) * 0.18;
          ctx.beginPath();
          ctx.strokeStyle = `rgba(255, 140, 60, ${alpha})`;
          ctx.lineWidth = 0.6;
          ctx.moveTo(stars[i].x, stars[i].y);
          ctx.lineTo(stars[j].x, stars[j].y);
          ctx.stroke();
        }
      }
      // Mouse proximity glow line
      const mdx = stars[i].x - mx;
      const mdy = stars[i].y - my;
      const md = Math.sqrt(mdx * mdx + mdy * mdy);
      if (md < 200) {
        const alpha = (1 - md / 200) * 0.35;
        ctx.beginPath();
        ctx.strokeStyle = `rgba(255, 107, 53, ${alpha})`;
        ctx.lineWidth = 0.8;
        ctx.moveTo(stars[i].x, stars[i].y);
        ctx.lineTo(mx, my);
        ctx.stroke();
      }
    }
    requestAnimationFrame(loop);
  }

  // Clear once at start to avoid trail on load
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);
  loop();

  // ════════════════════════════════════════════
  //  CUSTOM CURSOR
  // ════════════════════════════════════════════
  const dot = document.getElementById('cursorDot');
  const ring = document.getElementById('cursorRing');
  let ringX = 0, ringY = 0, dotX = 0, dotY = 0;

  document.addEventListener('mousemove', e => {
    dotX = e.clientX;
    dotY = e.clientY;
    dot.style.left = dotX - 3 + 'px';
    dot.style.top = dotY - 3 + 'px';
  });

  // Smooth ring follow
  function animateRing() {
    ringX += (dotX - ringX) * 0.12;
    ringY += (dotY - ringY) * 0.12;
    ring.style.left = ringX - 18 + 'px';
    ring.style.top = ringY - 18 + 'px';
    requestAnimationFrame(animateRing);
  }
  animateRing();

  // Hover effects
  const ctaBtn = document.getElementById('ctaBtn');
  ctaBtn.addEventListener('mouseenter', () => {
    ring.style.width = '70px';
    ring.style.height = '70px';
    ring.style.borderColor = '#ffa94d';
    ring.style.background = 'rgba(255, 107, 53, 0.06)';
    ring.style.left = dotX - 35 + 'px';
    ring.style.top = dotY - 35 + 'px';
  });
  ctaBtn.addEventListener('mouseleave', () => {
    ring.style.width = '36px';
    ring.style.height = '36px';
    ring.style.borderColor = 'rgba(255, 107, 53, 0.6)';
    ring.style.background = 'transparent';
  });
  </script>
</body>
</html>
