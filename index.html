<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoftTech Association | Web Design Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #10b981; /* Emerald */
      --secondary: #8b5cf6; /* Violet */
      --bg: #030014;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: none;
    }

    /* Aurora Background */
    #aurora-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
      filter: blur(100px);
      opacity: 0.6;
      overflow: hidden;
    }

    .aurora-orb {
      position: absolute;
      width: 60vw;
      height: 60vw;
      border-radius: 50%;
      background: var(--primary);
      animation: float 20s infinite alternate;
      mix-blend-mode: screen;
    }

    .aurora-orb:nth-child(2) {
      background: var(--secondary);
      right: -10vw;
      top: -10vw;
      animation-duration: 25s;
    }

    .aurora-orb:nth-child(3) {
      background: #3b82f6; /* Blue */
      left: -10vw;
      bottom: -10vw;
      animation-duration: 30s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(10vw, 5vw) scale(1.2); }
    }

    /* Custom Cursor */
    .cursor-dot {
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 10001;
      transform: translate(-50%, -50%);
    }

    .cursor-outline {
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 10000;
      transition: width 0.3s, height 0.3s, border-color 0.3s;
      transform: translate(-50%, -50%);
    }

    .content-wrapper {
      position: relative;
      z-index: 10;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    .header-box {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px 50px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .college-name {
      font-size: 0.9rem;
      letter-spacing: 6px;
      color: #cbd5e1;
      margin-bottom: 12px;
      font-weight: 500;
      text-transform: uppercase;
    }

    .dept-name {
      font-size: 1rem;
      letter-spacing: 4px;
      background: linear-gradient(to right, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      text-transform: uppercase;
    }

    .main-title-1 {
      font-size: 8rem;
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 0.85;
      color: #fff;
      text-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
    }

    .main-title-2 {
      font-size: 6rem;
      font-weight: 900;
      letter-spacing: 15px;
      margin-top: 10px;
      background: linear-gradient(to right, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.4));
    }

    .sub-title {
      font-size: 1.1rem;
      letter-spacing: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 300;
    }

    .btn-start {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 22px 70px;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 4px;
      text-decoration: none;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
      display: inline-block;
    }

    .btn-start:hover {
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 15px 40px rgba(16, 185, 129, 0.3);
      border-color: var(--primary);
    }

    .footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.75rem;
      color: #475569;
      letter-spacing: 3px;
      z-index: 10;
      text-transform: uppercase;
    }

    @media (max-width: 900px) {
      .main-title-1 { font-size: 5rem; }
      .main-title-2 { font-size: 3rem; }
      .header-box { padding: 15px 30px; }
    }
  </style>
</head>
<body>

  <!-- Custom Cursor -->
  <div class="cursor-dot"></div>
  <div class="cursor-outline"></div>

  <!-- Aurora Background -->
  <div id="aurora-container">
    <div class="aurora-orb"></div>
    <div class="aurora-orb"></div>
    <div class="aurora-orb"></div>
  </div>

  <div class="content-wrapper">
    
    <div class="header-box">
      <div class="college-name">AYYA NADAR JANAKI AMMAL COLLEGE</div>
      <div class="dept-name">DEPARTMENT OF COMPUTER APPLICATIONS</div>
    </div>

    <div class="main-title-container">
      <div class="main-title-1">SOFTTECH</div>
      <div class="main-title-2">ASSOCIATION</div>
    </div>

    <div class="sub-title">
      THE ULTIMATE WEB DESIGN CHALLENGE
    </div>

    <a href="login.html" class="btn-start">
      START SYSTEM
    </a>

  </div>

  <div class="footer">
    © 2026 ANJAC. DEPT OF COMPUTER APPLICATIONS.
  </div>

  <script>
    const dot = document.querySelector('.cursor-dot');
    const outline = document.querySelector('.cursor-outline');
    const orbs = document.querySelectorAll('.aurora-orb');

    document.addEventListener('mousemove', (e) => {
      const { clientX, clientY } = e;

      dot.style.left = `${clientX}px`;
      dot.style.top = `${clientY}px`;
      
      outline.animate({
        left: `${clientX}px`,
        top: `${clientY}px`
      }, { duration: 500, fill: "forwards" });

      // Interactive Orbs movement based on mouse
      orbs.forEach((orb, index) => {
        const speed = (index + 1) * 0.05;
        const x = (window.innerWidth - clientX * speed) / 100;
        const y = (window.innerHeight - clientY * speed) / 100;
        orb.style.transform = `translate(${x}px, ${y}px)`;
      });
    });

    const btn = document.querySelector('.btn-start');
    btn.addEventListener('mouseenter', () => {
      outline.style.width = '90px';
      outline.style.height = '90px';
      outline.style.borderColor = '#10b981';
      outline.style.backgroundColor = 'rgba(16, 185, 129, 0.05)';
    });

    btn.addEventListener('mouseleave', () => {
      outline.style.width = '40px';
      outline.style.height = '40px';
      outline.style.borderColor = 'rgba(255, 255, 255, 0.5)';
      outline.style.backgroundColor = 'transparent';
    });
  </script>
</body>
</html>
