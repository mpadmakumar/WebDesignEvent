<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoftTech Association | Web Design Challenge</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Montserrat:wght@400;700;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(-45deg, #05010a, #0d0628, #051a2e, #030810);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: none; /* Hide default cursor */
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Custom Cursor */
    .cursor {
      width: 20px;
      height: 20px;
      border: 2px solid #00ffff;
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.3s, height 0.3s, background-color 0.3s;
      mix-blend-mode: difference;
    }

    .cursor-arrow {
      position: fixed;
      pointer-events: none;
      z-index: 10000;
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 18px solid #00ffff;
      transform: translate(-50%, -50%) rotate(45deg);
      filter: drop-shadow(0 0 5px #00ffff);
    }

    .content-wrapper {
      position: relative;
      z-index: 10;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      padding: 0 20px;
    }

    .header-box {
      border: 1px solid rgba(0, 255, 255, 0.4);
      padding: 15px 40px;
      margin-bottom: 30px;
      display: inline-block;
      background: rgba(0, 20, 40, 0.3);
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
    }

    .college-name {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 5px;
      color: #ffffff;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .dept-name {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 4px;
      color: #00ffff;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
    }

    .main-title-container {
      margin-bottom: 25px;
      transition: transform 0.3s ease;
    }
    
    .main-title-container:hover {
      transform: scale(1.02);
    }

    .main-title-1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 7.5rem;
      line-height: 0.9;
      letter-spacing: 10px;
      color: #0088ff;
      text-shadow: 0 0 20px rgba(0, 136, 255, 0.8), 0 0 40px rgba(0, 136, 255, 0.4);
    }

    .main-title-2 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 6.5rem;
      line-height: 1;
      letter-spacing: 15px;
      color: #00ffff;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 0 40px rgba(0, 255, 255, 0.4);
      margin-top: -10px;
    }

    .sub-title {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.2rem;
      letter-spacing: 10px;
      color: #d1d1d1;
      text-transform: uppercase;
      margin-bottom: 40px;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
    }

    .btn-start {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.4rem;
      letter-spacing: 5px;
      color: #00ffff;
      background: transparent;
      border: 1px solid rgba(0, 255, 255, 0.6);
      padding: 18px 45px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: inline-block;
      position: relative;
      background: rgba(0, 255, 255, 0.05);
    }

    .btn-start:hover {
      background: rgba(0, 255, 255, 0.2);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.6), inset 0 0 10px rgba(0, 255, 255, 0.4);
      color: #ffffff;
      text-shadow: 0 0 10px #00ffff;
      transform: translateY(-5px);
    }

    .footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.75rem;
      color: #444;
      letter-spacing: 1px;
      z-index: 10;
    }

    @media (max-width: 900px) {
      .main-title-1 { font-size: 5rem; }
      .main-title-2 { font-size: 4rem; }
      .header-box { padding: 15px 20px; }
      .college-name { font-size: 0.8rem; }
      .dept-name { font-size: 0.7rem; }
    }
  </style>
</head>
<body>

  <!-- Custom Cursor -->
  <div class="cursor"></div>
  <div class="cursor-arrow"></div>

  <div class="content-wrapper">
    
    <div class="header-box">
      <div class="college-name">AYYA NADAR JANAKI AMMAL COLLEGE</div>
      <div class="dept-name">DEPARTMENT OF COMPUTER APPLICATIONS</div>
    </div>

    <div class="main-title-container">
      <div class="main-title-1">SOFTTECH</div>
      <div class="main-title-2">ASSOCIATION</div>
    </div>

    <div class="sub-title">
      THE ULTIMATE WEB DESIGN CHALLENGE
    </div>

    <a href="login.html" class="btn-start">
      > START_SYSTEM
    </a>

  </div>

  <div class="footer">
    © 2026 Ayya Nadar Janaki Ammal College. Dept. of Computer Applications. All rights reserved.
  </div>

  <script>
    const cursor = document.querySelector('.cursor');
    const arrow = document.querySelector('.cursor-arrow');

    document.addEventListener('mousemove', (e) => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
      
      // Smoothly move the arrow with a slight delay
      setTimeout(() => {
        arrow.style.left = e.clientX + 'px';
        arrow.style.top = e.clientY + 'px';
      }, 50);
    });

    document.querySelectorAll('a, button').forEach(el => {
      el.addEventListener('mouseenter', () => {
        cursor.style.width = '40px';
        cursor.style.height = '40px';
        cursor.style.backgroundColor = 'rgba(0, 255, 255, 0.1)';
      });
      el.addEventListener('mouseleave', () => {
        cursor.style.width = '20px';
        cursor.style.height = '20px';
        cursor.style.backgroundColor = 'transparent';
      });
    });
  </script>
</body>
</html>
