<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoftTech Association | Web Design Challenge</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Montserrat:wght@400;700;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #080310;
      background-image: radial-gradient(circle at center, #150a21 0%, #080310 100%);
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Canvas Background */
    #particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .content-wrapper {
      position: relative;
      z-index: 10;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .header-box {
      border: 1px solid rgba(0, 255, 255, 0.3);
      padding: 15px 40px;
      margin-bottom: 30px;
      display: inline-block;
    }

    .college-name {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 4px;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .dept-name {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 3px;
      color: #0088ff; /* Darker blue to match the first color */
    }

    .main-title-container {
      margin-bottom: 25px;
    }

    .main-title-1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 7rem;
      line-height: 1;
      letter-spacing: 6px;
      color: #0088ff; /* Corresponds to Orange */
      text-shadow: 0 0 20px rgba(0, 136, 255, 0.6);
    }

    .main-title-2 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 6rem;
      line-height: 1;
      letter-spacing: 12px;
      color: #00ffff; /* Corresponds to Yellow */
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
    }

    .sub-title {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.1rem;
      letter-spacing: 8px;
      color: #b0b0b0;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .btn-start {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.2rem;
      letter-spacing: 4px;
      color: #0088ff;
      background: transparent;
      border: 1px solid rgba(0, 136, 255, 0.5);
      padding: 12px 30px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .btn-start:hover {
      background: rgba(0, 136, 255, 0.1);
      box-shadow: 0 0 15px rgba(0, 136, 255, 0.3);
      text-shadow: 0 0 8px #0088ff;
    }

    .footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.75rem;
      color: #444;
      letter-spacing: 1px;
      z-index: 10;
    }

    @media (max-width: 900px) {
      .main-title-1 { font-size: 5rem; }
      .main-title-2 { font-size: 4rem; }
      .header-box { padding: 15px 20px; }
      .college-name { font-size: 0.8rem; }
      .dept-name { font-size: 0.7rem; }
    }
  </style>
</head>
<body>

  <!-- Particle Background -->
  <canvas id="particle-canvas"></canvas>

  <div class="content-wrapper">
    
    <div class="header-box">
      <div class="college-name">AYYA NADAR JANAKI AMMAL COLLEGE</div>
      <div class="dept-name">DEPARTMENT OF COMPUTER APPLICATIONS</div>
    </div>

    <div class="main-title-container">
      <div class="main-title-1">SOFTTECH</div>
      <div class="main-title-2">ASSOCIATION</div>
    </div>

    <div class="sub-title">
      THE ULTIMATE WEB DESIGN CHALLENGE
    </div>

    <a href="login.html" class="btn-start">
      > START_SYSTEM
    </a>

  </div>

  <div class="footer">
    © 2026 Ayya Nadar Janaki Ammal College. Dept. of Computer Applications. All rights reserved.
  </div>

  <script>
    // Particle Network Animation
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.radius = Math.random() * 2 + 1; // Slightly larger particles
        
        // Multi-color dots to match the exact image (Orange, Yellow, Purple)
        const colors = [
          { r: 255, g: 140, b: 0 },   // Orange
          { r: 255, g: 215, b: 0 },   // Yellow
          { r: 138, g: 43,  b: 226 }  // Purple
        ];
        this.baseColor = colors[Math.floor(Math.random() * colors.length)];
        this.colorStr = \`rgba(\${this.baseColor.r}, \${this.baseColor.g}, \${this.baseColor.b}, 0.9)\`;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > width) this.vx = -this.vx;
        if (this.y < 0 || this.y > height) this.vy = -this.vy;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.colorStr;
        ctx.fill();
        
        // Soft glowing aura around particle
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.colorStr;
      }
    }

    function initParticles() {
      particles = [];
      const numParticles = Math.floor((width * height) / 10000); 
      for (let i = 0; i < numParticles; i++) {
        particles.push(new Particle());
      }
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
        ctx.shadowBlur = 0; // reset shadow before drawing lines

        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          // Connect nearby particles to form constellations
          if (distance < 140) {
            ctx.beginPath();
            // Extremely faint yellowish/orange lines to match the image
            ctx.strokeStyle = \`rgba(255, 180, 50, \${0.15 - distance/933})\`;
            ctx.lineWidth = 0.5;
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animate);
    }

    initParticles();
    animate();
  </script>
</body>
</html>
