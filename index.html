<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoftTech Association | Web Design Challenge</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Montserrat:wght@400;700;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #080310;
      background-image: radial-gradient(circle at center, #150a21 0%, #080310 100%);
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Canvas Background */
    #particles-js {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .content-wrapper {
      position: relative;
      z-index: 10;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .header-box {
      border: 1px solid rgba(0, 255, 255, 0.3);
      padding: 15px 40px;
      margin-bottom: 30px;
      display: inline-block;
    }

    .college-name {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 4px;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .dept-name {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 3px;
      color: #0088ff; /* Darker blue to match the first color */
    }

    .main-title-container {
      margin-bottom: 25px;
    }

    .main-title-1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 7rem;
      line-height: 1;
      letter-spacing: 6px;
      color: #0088ff; /* Corresponds to Orange */
      text-shadow: 0 0 20px rgba(0, 136, 255, 0.6);
    }

    .main-title-2 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 6rem;
      line-height: 1;
      letter-spacing: 12px;
      color: #00ffff; /* Corresponds to Yellow */
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
    }

    .sub-title {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.1rem;
      letter-spacing: 8px;
      color: #b0b0b0;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .btn-start {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.2rem;
      letter-spacing: 4px;
      color: #0088ff;
      background: transparent;
      border: 1px solid rgba(0, 136, 255, 0.5);
      padding: 12px 30px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .btn-start:hover {
      background: rgba(0, 136, 255, 0.1);
      box-shadow: 0 0 15px rgba(0, 136, 255, 0.3);
      text-shadow: 0 0 8px #0088ff;
    }

    .footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.75rem;
      color: #444;
      letter-spacing: 1px;
      z-index: 10;
    }

    @media (max-width: 900px) {
      .main-title-1 { font-size: 5rem; }
      .main-title-2 { font-size: 4rem; }
      .header-box { padding: 15px 20px; }
      .college-name { font-size: 0.8rem; }
      .dept-name { font-size: 0.7rem; }
    }
  </style>
</head>
<body>

  <!-- Particle Background -->
  <div id="particles-js"></div>

  <div class="content-wrapper">
    
    <div class="header-box">
      <div class="college-name">AYYA NADAR JANAKI AMMAL COLLEGE</div>
      <div class="dept-name">DEPARTMENT OF COMPUTER APPLICATIONS</div>
    </div>

    <div class="main-title-container">
      <div class="main-title-1">SOFTTECH</div>
      <div class="main-title-2">ASSOCIATION</div>
    </div>

    <div class="sub-title">
      THE ULTIMATE WEB DESIGN CHALLENGE
    </div>

    <a href="login.html" class="btn-start">
      > START_SYSTEM
    </a>

  </div>

  <div class="footer">
    © 2026 Ayya Nadar Janaki Ammal College. Dept. of Computer Applications. All rights reserved.
  </div>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    particlesJS('particles-js', {
      "particles": {
        "number": {
          "value": 60,
          "density": { "enable": true, "value_area": 800 }
        },
        "color": {
          "value": ["#00ffff", "#0088ff", "#0055ff"]
        },
        "shape": {
          "type": "circle"
        },
        "opacity": {
          "value": 0.8,
          "random": true,
          "anim": { "enable": true, "speed": 1, "opacity_min": 0.3, "sync": false }
        },
        "size": {
          "value": 3,
          "random": true,
          "anim": { "enable": false }
        },
        "line_linked": {
          "enable": true,
          "distance": 150,
          "color": "#00aaff",
          "opacity": 0.2,
          "width": 1
        },
        "move": {
          "enable": true,
          "speed": 1.5,
          "direction": "none",
          "random": true,
          "straight": false,
          "out_mode": "out",
          "bounce": false
        }
      },
      "interactivity": {
        "detect_on": "canvas",
        "events": {
          "onhover": { "enable": true, "mode": "grab" },
          "onclick": { "enable": true, "mode": "push" },
          "resize": true
        },
        "modes": {
          "grab": { "distance": 180, "line_linked": { "opacity": 0.5 } },
          "push": { "particles_nb": 3 }
        }
      },
      "retina_detect": true
    });
  </script>
</body>
</html>
