<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoftTech Association | Web Design Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #2b2d42;
      color: #edf2f4;
      font-family: 'Rajdhani', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: none;
    }

    /* ═══ BACKGROUND CANVAS ═══ */
    canvas#geo {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    /* ═══ VIGNETTE OVERLAY ═══ */
    .vignette {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(43,45,66,0.8) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* ═══ CURSOR ═══ */
    .c-dot {
      width: 6px; height: 6px;
      background: #ef233c;
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 10001;
      box-shadow: 0 0 6px #ef233c, 0 0 14px rgba(239,35,60,0.5);
    }
    .c-ring {
      width: 36px; height: 36px;
      border: 1.5px solid rgba(239, 35, 60, 0.4);
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 10000;
      transition: width 0.35s, height 0.35s, border-color 0.3s, background 0.3s;
    }

    /* ═══ CONTENT ═══ */
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 38px;
    }

    /* ── Header ── */
    .hbox {
      padding: 20px 60px;
      position: relative;
      background: rgba(43, 45, 66, 0.6);
      backdrop-filter: blur(12px);
      border-left: 3px solid #ef233c;
      border-right: 3px solid #ef233c;
    }

    .hbox::before, .hbox::after {
      content: '';
      position: absolute;
      width: 100%; height: 1px;
      background: linear-gradient(90deg, #ef233c 0%, rgba(141,153,174,0.3) 50%, #ef233c 100%);
      left: 0;
    }
    .hbox::before { top: 0; }
    .hbox::after { bottom: 0; }

    .col-name {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 6px;
      color: #edf2f4;
      text-transform: uppercase;
    }

    .dep-name {
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 4px;
      color: #ef233c;
      margin-top: 8px;
    }

    /* ── Titles ── */
    .t1 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 8rem;
      letter-spacing: 10px;
      line-height: 0.88;
      color: #edf2f4;
      text-shadow: 0 0 40px rgba(239, 35, 60, 0.25);
      position: relative;
    }

    /* Red underline accent */
    .t1::after {
      content: '';
      display: block;
      width: 60%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ef233c, transparent);
      margin: 12px auto 0;
    }

    .t2 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 5.5rem;
      letter-spacing: 24px;
      color: #ef233c;
      text-shadow: 0 0 30px rgba(239, 35, 60, 0.3);
      margin-top: 8px;
    }

    /* ── Subtitle ── */
    .sub {
      font-size: 1.2rem;
      letter-spacing: 10px;
      color: #8d99ae;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* ── CTA ── */
    .cta {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: 5px;
      color: #edf2f4;
      background: transparent;
      border: 1px solid rgba(239, 35, 60, 0.4);
      padding: 16px 55px;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      transition: all 0.4s ease;
    }

    .cta::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 0; height: 2px;
      background: #ef233c;
      transition: width 0.4s ease;
    }

    .cta:hover {
      background: rgba(239, 35, 60, 0.08);
      border-color: #ef233c;
      box-shadow: 0 0 25px rgba(239, 35, 60, 0.15);
    }

    .cta:hover::after { width: 100%; }

    /* ── Footer ── */
    .foot {
      position: absolute;
      bottom: 22px;
      font-size: 0.7rem;
      color: #555;
      letter-spacing: 2px;
      z-index: 10;
      text-transform: uppercase;
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .t1 { font-size: 4.5rem; letter-spacing: 5px; }
      .t2 { font-size: 3rem; letter-spacing: 14px; }
      .hbox { padding: 14px 25px; }
      .col-name { font-size: 0.85rem; }
      .sub { font-size: 0.9rem; letter-spacing: 5px; }
    }
    @media (max-width: 500px) {
      .t1 { font-size: 3rem; }
      .t2 { font-size: 2rem; letter-spacing: 8px; }
    }
  </style>
</head>
<body>

  <div class="c-dot" id="cDot"></div>
  <div class="c-ring" id="cRing"></div>
  <div class="vignette"></div>

  <canvas id="geo"></canvas>

  <div class="content">
    <div class="hbox">
      <div class="col-name">Ayya Nadar Janaki Ammal College</div>
      <div class="dep-name">Department of Computer Applications</div>
    </div>

    <div>
      <div class="t1">SOFTTECH</div>
      <div class="t2">ASSOCIATION</div>
    </div>

    <div class="sub">The Ultimate Web Design Challenge</div>

    <a href="login.html" class="cta" id="ctaBtn">> START_SYSTEM</a>
  </div>

  <div class="foot">© 2026 Ayya Nadar Janaki Ammal College · Dept. of Computer Applications</div>

  <script>
  // ═══════════════════════════════════════════
  //  FLOATING WIREFRAME GEOMETRY ANIMATION
  //  (Unique: NOT particles, NOT grid, NOT scan)
  // ═══════════════════════════════════════════
  const cv = document.getElementById('geo');
  const cx = cv.getContext('2d');
  let W, H;

  function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  addEventListener('resize', resize);
  resize();

  // Colors from palette
  const C = {
    dark: '#2b2d42',
    gray: '#8d99ae',
    light: '#edf2f4',
    red: '#ef233c'
  };

  let mx = -500, my = -500;
  addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

  // ─── Floating Shapes ───
  class Shape {
    constructor() {
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.vx = (Math.random() - 0.5) * 0.4;
      this.vy = (Math.random() - 0.5) * 0.4;
      this.rot = Math.random() * Math.PI * 2;
      this.rotSpeed = (Math.random() - 0.5) * 0.008;
      this.size = Math.random() * 40 + 20;
      this.sides = [3, 4, 5, 6][Math.floor(Math.random() * 4)]; // tri, sq, pent, hex
      this.alpha = Math.random() * 0.15 + 0.05;
      this.baseAlpha = this.alpha;
      this.isRed = Math.random() < 0.2; // 20% chance red accent
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.rot += this.rotSpeed;

      // Wrap around edges
      if (this.x < -60) this.x = W + 60;
      if (this.x > W + 60) this.x = -60;
      if (this.y < -60) this.y = H + 60;
      if (this.y > H + 60) this.y = -60;

      // Mouse proximity: glow brighter
      const dx = this.x - mx;
      const dy = this.y - my;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < 250) {
        this.alpha = this.baseAlpha + (1 - d / 250) * 0.25;
      } else {
        this.alpha += (this.baseAlpha - this.alpha) * 0.05;
      }
    }

    draw() {
      cx.save();
      cx.translate(this.x, this.y);
      cx.rotate(this.rot);

      cx.beginPath();
      for (let i = 0; i <= this.sides; i++) {
        const angle = (i / this.sides) * Math.PI * 2;
        const px = Math.cos(angle) * this.size;
        const py = Math.sin(angle) * this.size;
        if (i === 0) cx.moveTo(px, py);
        else cx.lineTo(px, py);
      }
      cx.closePath();

      const col = this.isRed ? C.red : C.gray;
      cx.strokeStyle = col;
      cx.globalAlpha = this.alpha;
      cx.lineWidth = 1;
      cx.stroke();

      // Inner shape (smaller, faint)
      cx.beginPath();
      for (let i = 0; i <= this.sides; i++) {
        const angle = (i / this.sides) * Math.PI * 2 + Math.PI / this.sides;
        const px = Math.cos(angle) * this.size * 0.5;
        const py = Math.sin(angle) * this.size * 0.5;
        if (i === 0) cx.moveTo(px, py);
        else cx.lineTo(px, py);
      }
      cx.closePath();
      cx.globalAlpha = this.alpha * 0.4;
      cx.stroke();

      cx.restore();
      cx.globalAlpha = 1;
    }
  }

  // ─── Floating Dots (subtle) ───
  class Dot {
    constructor() {
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.r = Math.random() * 1.5 + 0.5;
      this.phase = Math.random() * Math.PI * 2;
      this.speed = Math.random() * 0.015 + 0.005;
      this.isRed = Math.random() < 0.15;
    }

    update() {
      this.phase += this.speed;
    }

    draw() {
      const a = 0.15 + 0.2 * Math.sin(this.phase);
      cx.beginPath();
      cx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      cx.fillStyle = this.isRed
        ? `rgba(239, 35, 60, ${a})`
        : `rgba(141, 153, 174, ${a})`;
      cx.fill();
    }
  }

  // ─── Horizontal flowing lines ───
  class FlowLine {
    constructor(y) {
      this.y = y;
      this.points = [];
      const segs = 40;
      for (let i = 0; i <= segs; i++) {
        this.points.push({
          x: (i / segs) * W,
          baseY: y,
          offset: Math.random() * Math.PI * 2,
          amp: Math.random() * 8 + 3,
          freq: Math.random() * 0.003 + 0.001
        });
      }
      this.isRed = Math.random() < 0.25;
    }

    draw(time) {
      cx.beginPath();
      for (let i = 0; i < this.points.length; i++) {
        const p = this.points[i];
        const yy = p.baseY + Math.sin(time * p.freq + p.offset) * p.amp;

        // Mouse ripple
        const dx = p.x - mx;
        const dy = p.baseY - my;
        const d = Math.sqrt(dx * dx + dy * dy);
        const ripple = d < 200 ? Math.sin((1 - d / 200) * Math.PI) * 15 : 0;

        if (i === 0) cx.moveTo(p.x, yy + ripple);
        else cx.lineTo(p.x, yy + ripple);
      }

      cx.strokeStyle = this.isRed
        ? 'rgba(239, 35, 60, 0.06)'
        : 'rgba(141, 153, 174, 0.05)';
      cx.lineWidth = 1;
      cx.stroke();
    }
  }

  // Init
  const shapes = [];
  for (let i = 0; i < 18; i++) shapes.push(new Shape());

  const dots = [];
  for (let i = 0; i < 100; i++) dots.push(new Dot());

  const flowLines = [];
  for (let y = 0; y < H; y += 25) flowLines.push(new FlowLine(y));

  let time = 0;

  function render() {
    time++;

    // Fade trail
    cx.fillStyle = 'rgba(43, 45, 66, 0.12)';
    cx.fillRect(0, 0, W, H);

    // Flow lines
    for (const fl of flowLines) fl.draw(time);

    // Dots
    for (const d of dots) { d.update(); d.draw(); }

    // Shapes
    for (const s of shapes) { s.update(); s.draw(); }

    // Mouse glow
    if (mx > 0) {
      const grad = cx.createRadialGradient(mx, my, 0, mx, my, 180);
      grad.addColorStop(0, 'rgba(239, 35, 60, 0.04)');
      grad.addColorStop(1, 'rgba(239, 35, 60, 0)');
      cx.fillStyle = grad;
      cx.fillRect(mx - 180, my - 180, 360, 360);
    }

    requestAnimationFrame(render);
  }

  // Initial clear
  cx.fillStyle = C.dark;
  cx.fillRect(0, 0, W, H);
  render();

  // ═══ CURSOR ═══
  const dot = document.getElementById('cDot');
  const ring = document.getElementById('cRing');
  let rx = 0, ry = 0;

  document.addEventListener('mousemove', e => {
    dot.style.left = e.clientX - 3 + 'px';
    dot.style.top = e.clientY - 3 + 'px';
  });

  (function moveRing() {
    rx += (mx - rx) * 0.1;
    ry += (my - ry) * 0.1;
    ring.style.left = rx - 18 + 'px';
    ring.style.top = ry - 18 + 'px';
    requestAnimationFrame(moveRing);
  })();

  const ctaBtn = document.getElementById('ctaBtn');
  ctaBtn.addEventListener('mouseenter', () => {
    ring.style.width = '70px';
    ring.style.height = '70px';
    ring.style.borderColor = '#ef233c';
    ring.style.background = 'rgba(239, 35, 60, 0.06)';
  });
  ctaBtn.addEventListener('mouseleave', () => {
    ring.style.width = '36px';
    ring.style.height = '36px';
    ring.style.borderColor = 'rgba(239, 35, 60, 0.4)';
    ring.style.background = 'transparent';
  });
  </script>
</body>
</html>
