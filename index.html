<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoftTech Association | Web Design Challenge</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Montserrat:wght@400;700;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #05010a;
      background-image: radial-gradient(circle at center, #1a052e 0%, #05010a 100%);
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Scanline effect */
    body::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 20;
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
    }

    #particles-js {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .content-wrapper {
      position: relative;
      z-index: 10;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      padding: 0 20px;
    }

    .header-box {
      border: 1px solid rgba(255, 0, 255, 0.3);
      padding: 15px 40px;
      margin-bottom: 30px;
      display: inline-block;
      background: rgba(20, 5, 40, 0.4);
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(255, 0, 255, 0.1);
    }

    .college-name {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 5px;
      color: #ffffff;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .dept-name {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 4px;
      color: #ff00ff;
      text-shadow: 0 0 10px rgba(255, 0, 255, 0.8);
    }

    .main-title-container {
      margin-bottom: 25px;
      transition: transform 0.3s ease;
    }
    
    .main-title-container:hover {
      transform: scale(1.02);
    }

    .main-title-1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 7.5rem;
      line-height: 0.9;
      letter-spacing: 10px;
      color: #bc13fe;
      text-shadow: 0 0 20px rgba(188, 19, 254, 0.8), 0 0 40px rgba(188, 19, 254, 0.4);
    }

    .main-title-2 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 6.5rem;
      line-height: 1;
      letter-spacing: 15px;
      color: #ff00ff;
      text-shadow: 0 0 20px rgba(255, 0, 255, 0.8), 0 0 40px rgba(255, 0, 255, 0.4);
      margin-top: -10px;
    }

    .sub-title {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.2rem;
      letter-spacing: 10px;
      color: #d1d1d1;
      text-transform: uppercase;
      margin-bottom: 40px;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
    }

    .btn-start {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.4rem;
      letter-spacing: 5px;
      color: #ff00ff;
      background: transparent;
      border: 1px solid rgba(255, 0, 255, 0.6);
      padding: 18px 45px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: inline-block;
      position: relative;
      background: rgba(255, 0, 255, 0.05);
    }

    .btn-start:hover {
      background: rgba(255, 0, 255, 0.2);
      box-shadow: 0 0 30px rgba(255, 0, 255, 0.6), inset 0 0 10px rgba(255, 0, 255, 0.4);
      color: #ffffff;
      text-shadow: 0 0 10px #ff00ff;
      transform: translateY(-5px);
    }

    .footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.75rem;
      color: #444;
      letter-spacing: 1px;
      z-index: 10;
    }

    @media (max-width: 900px) {
      .main-title-1 { font-size: 5rem; }
      .main-title-2 { font-size: 4rem; }
      .header-box { padding: 15px 20px; }
      .college-name { font-size: 0.8rem; }
      .dept-name { font-size: 0.7rem; }
    }
  </style>
</head>
<body>

  <!-- Particle Background -->
  <div id="particles-js"></div>

  <div class="content-wrapper">
    
    <div class="header-box">
      <div class="college-name">AYYA NADAR JANAKI AMMAL COLLEGE</div>
      <div class="dept-name">DEPARTMENT OF COMPUTER APPLICATIONS</div>
    </div>

    <div class="main-title-container">
      <div class="main-title-1">SOFTTECH</div>
      <div class="main-title-2">ASSOCIATION</div>
    </div>

    <div class="sub-title">
      THE ULTIMATE WEB DESIGN CHALLENGE
    </div>

    <a href="login.html" class="btn-start">
      > START_SYSTEM
    </a>

  </div>

  <div class="footer">
    © 2026 Ayya Nadar Janaki Ammal College. Dept. of Computer Applications. All rights reserved.
  </div>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    particlesJS('particles-js', {
      "particles": {
        "number": {
          "value": 80,
          "density": { "enable": true, "value_area": 800 }
        },
        "color": {
          "value": ["#ff00ff", "#bc13fe", "#7a00ff"]
        },
        "shape": {
          "type": "circle"
        },
        "opacity": {
          "value": 0.6,
          "random": true,
          "anim": { "enable": true, "speed": 1, "opacity_min": 0.1, "sync": false }
        },
        "size": {
          "value": 3,
          "random": true,
          "anim": { "enable": false }
        },
        "line_linked": {
          "enable": true,
          "distance": 150,
          "color": "#bc13fe",
          "opacity": 0.3,
          "width": 1
        },
        "move": {
          "enable": true,
          "speed": 2,
          "direction": "none",
          "random": true,
          "straight": false,
          "out_mode": "out",
          "bounce": false
        }
      },
      "interactivity": {
        "detect_on": "canvas",
        "events": {
          "onhover": { "enable": true, "mode": "grab" },
          "onclick": { "enable": true, "mode": "push" },
          "resize": true
        },
        "modes": {
          "grab": { "distance": 140, "line_linked": { "opacity": 0.6 } },
          "push": { "particles_nb": 4 }
        }
      },
      "retina_detect": true
    });
  </script>
</body>
</html>
