<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenges | Admin Panel</title>
    <link rel="stylesheet" href="../css/style.css">`n  <script src="../js/loader.js"></script>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="bg-animate"></div>
    <div class="admin-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand"><h2><span>ðŸŽ¨ DesignArena</span></h2><small>Admin Panel</small></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item" data-page="dashboard"><span class="nav-icon">ðŸ“Š</span> Dashboard</a>
                <a href="participants.html" class="nav-item" data-page="participants"><span class="nav-icon">ðŸ‘¥</span> Participants</a>
                <a href="challenges.html" class="nav-item" data-page="challenges"><span class="nav-icon">ðŸŽ¨</span> Challenges</a>
                <a href="monitoring.html" class="nav-item" data-page="monitoring"><span class="nav-icon">ðŸ“¡</span> Live Monitor</a>
                <a href="submissions.html" class="nav-item" data-page="submissions"><span class="nav-icon">ðŸ“</span> Submissions</a>
                <a href="results.html" class="nav-item" data-page="results"><span class="nav-icon">ðŸ†</span> Results</a>
            </nav>
            <div class="sidebar-footer"><button class="btn btn-danger btn-sm" style="width:100%" onclick="AdminApp.logout()">ðŸšª Logout</button></div>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div style="display:flex;align-items:center;gap:12px">
                    <button class="sidebar-toggle" onclick="AdminApp.toggleSidebar()">â˜°</button>
                    <h1>ðŸŽ¨ Challenges (<span id="challenge-count">0</span>)</h1>
                </div>
                <div class="header-actions">
                    <span id="admin-name" style="font-size:.85rem;color:var(--text-secondary)"></span>
                    <div class="theme-toggle" onclick="AdminApp.toggleTheme()"></div>
                </div>
            </header>

            <div class="admin-content">
                <div class="toolbar fade-in">
                    <div style="flex:1"></div>
                    <button class="btn btn-primary btn-sm" onclick="AdminApp.showAddChallenge()">âž• Add Challenge</button>
                </div>
                <div id="challenges-list" class="monitor-grid fade-in"></div>
            </div>
        </main>
    </div>

    <!-- Challenge Modal -->
    <div class="modal-overlay" id="challenge-modal">
        <div class="modal" style="max-width:700px">
            <div class="modal-header">
                <h2 id="ch-modal-title">Add Challenge</h2>
                <button class="modal-close" onclick="AdminApp.closeModal('challenge-modal')">&times;</button>
            </div>
            <form id="ch-form" onsubmit="event.preventDefault(); AdminApp.saveChallenge()">
                <input type="hidden" id="ch-id">
                <div class="form-group">
                    <label for="ch-title">Title</label>
                    <input type="text" id="ch-title" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="ch-desc">Description</label>
                    <textarea id="ch-desc" class="form-control" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label for="ch-instructions">Instructions</label>
                    <textarea id="ch-instructions" class="form-control" rows="4"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="ch-time">Time Limit (minutes)</label>
                        <input type="number" id="ch-time" class="form-control" value="30" min="1">
                    </div>
                    <div class="form-group">
                        <label for="ch-score">Max Score</label>
                        <input type="number" id="ch-score" class="form-control" value="100" min="1">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="ch-order">Order</label>
                        <input type="number" id="ch-order" class="form-control" value="1" min="1">
                    </div>
                    <div class="form-group">
                        <label for="ch-minlines">Min Lines Required</label>
                        <input type="number" id="ch-minlines" class="form-control" value="10" min="1">
                    </div>
                </div>
                <div class="form-group" style="display:flex;align-items:center;gap:12px">
                    <label class="toggle-switch">
                        <input type="checkbox" id="ch-active" checked>
                        <span class="toggle-slider"></span>
                    </label>
                    <span style="font-size:.9rem">Active</span>
                </div>
                <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
                    <button type="button" class="btn btn-secondary" onclick="AdminApp.closeModal('challenge-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">ðŸ’¾ Save Challenge</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => AdminApp.initChallenges());</script>
</body>
</html>
