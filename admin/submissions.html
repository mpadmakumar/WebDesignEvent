<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submissions | Admin</title>
  <link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css">
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><h2>🎨 DesignArena</h2><small>Admin Panel</small></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item" data-page="dashboard"><span class="nav-icon">📊</span> Dashboard</a>
      <a href="participants.html" class="nav-item" data-page="participants"><span class="nav-icon">👥</span> Participants</a>
      <a href="monitoring.html" class="nav-item" data-page="monitoring"><span class="nav-icon">📡</span> Live Monitor</a>
      <a href="submissions.html" class="nav-item" data-page="submissions"><span class="nav-icon">📝</span> Submissions</a>
      <a href="results.html" class="nav-item" data-page="results"><span class="nav-icon">🏆</span> Results</a>
      <a href="notes.html" class="nav-item" data-page="notes"><span class="nav-icon">📋</span> Notes</a>
      <a href="designs.html" class="nav-item" data-page="designs"><span class="nav-icon">📌</span> Push Designs</a>
      <a href="settings.html" class="nav-item" data-page="settings"><span class="nav-icon">⚙️</span> Settings</a>
    </nav>
    <div class="sidebar-footer"><button class="btn btn-danger btn-sm" style="width:100%" onclick="AdminApp.logout()">🚪 Logout</button></div>
  </aside>
  <main class="admin-main">
    <header class="admin-header">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="sidebar-toggle" onclick="AdminApp.toggleSidebar()">☰</button>
        <h1>📝 Submissions</h1>
      </div>
      <div class="header-actions">
        <span style="font-size:.85rem;color:var(--text-secondary)">👤 <span id="admin-name">Admin</span></span>
        <div class="theme-toggle" onclick="AdminApp.toggleTheme()"></div>
      </div>
    </header>
    <div class="admin-content">
      <div class="section-header fade-in">
        <h2>Submissions</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <input type="text" class="form-control" style="width:250px" placeholder="🔍 Search by Lot Number..." oninput="AdminApp.renderSubmissions(this.value)">
      </div>
      <div id="submissions-table" class="fade-in"></div>
    </div>
  </main>
</div>

<!-- Review Modal -->
<div class="modal-overlay" id="review-modal">
  <div class="modal-box" style="max-width:700px">
    <div class="modal-header">
      <h3>🔍 Review Submission</h3>
      <button class="modal-close" onclick="AdminApp.closeModal('review-modal')">✕</button>
    </div>
    <div style="margin-bottom:14px">
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px">
        <span><strong>Participant:</strong> <span id="review-participant"></span></span>
        <span><strong>Challenge:</strong> <span id="review-challenge"></span></span>
      </div>
      <div id="review-stats" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"></div>
    </div>
    <!-- Code view -->
    <pre class="code-display" id="review-code" style="display:none"></pre>
    <!-- Design image -->
    <img id="review-design-img" style="display:none;max-width:100%;border-radius:8px;border:1px solid var(--border)">
    <!-- Quiz answers -->
    <div id="review-questions" style="display:none;max-height:300px;overflow-y:auto"></div>
    <!-- Preview frame -->
    <div style="margin-top:12px">
      <iframe id="review-preview-frame" style="display:none;width:100%;height:250px;border:1px solid var(--border);border-radius:8px;background:#fff"></iframe>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="AdminApp.closeModal('review-modal')">Close</button>
    </div>
  </div>
</div>

<script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/admin.js"></script>
<script>document.addEventListener('DOMContentLoaded',()=>AdminApp.initSubmissions());</script>
</body></html>
