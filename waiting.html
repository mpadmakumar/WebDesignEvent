<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waiting Room | Web Design Competition</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <style>
    .waiting-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      position: relative;
      z-index: 10;
    }
    .waiting-box {
      border: 1px solid rgba(255, 75, 110, 0.3);
      padding: 60px 100px;
      background: rgba(10, 10, 30, 0.6);
      border-radius: 2px;
      position: relative;
      box-shadow: 0 0 30px rgba(255, 75, 110, 0.15), inset 0 0 20px rgba(255, 75, 110, 0.05);
      backdrop-filter: blur(16px);
    }
    .waiting-box::before, .waiting-box::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      border-color: #ff4b6e;
      border-style: solid;
    }
    .waiting-box::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .waiting-box::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    /* Futuristic Multi-Ring Loader */
    .cyber-loader {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 35px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cyber-loader .circle {
      position: absolute;
      border-radius: 50%;
      border: 3px solid transparent;
      animation: spin linear infinite;
    }
    .cyber-loader .circle:nth-child(1) { 
      width: 100px; height: 100px; 
      border-top-color: #ff4b6e; border-bottom-color: #5b8cff; 
      animation-duration: 2s; 
    }
    .cyber-loader .circle:nth-child(2) { 
      width: 70px; height: 70px; 
      border-right-color: #ffca3a; border-left-color: #ff4b6e; 
      animation-duration: 1.5s; 
      animation-direction: reverse; 
    }
    .cyber-loader .circle:nth-child(3) { 
      width: 40px; height: 40px; 
      border-top-color: #5b8cff; border-bottom-color: #ffca3a; 
      animation-duration: 3s; 
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .waiting-title {
      font-family: var(--font-heading);
      font-size: 3.2rem;
      font-weight: 900;
      margin-bottom: 20px;
      letter-spacing: 8px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #a8c8ff 40%, #ff4b6e 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradPulse 4s ease-in-out infinite alternate;
    }
    @keyframes gradPulse {
      0% { background-position: 0% 50%; filter: drop-shadow(0 0 5px rgba(255,75,110,0.3)); }
      100% { background-position: 100% 50%; filter: drop-shadow(0 0 15px rgba(255,75,110,0.8)); }
    }

    .waiting-text {
      color: #edf2f4;
      font-size: 1rem;
      letter-spacing: 4px;
      font-family: var(--font-mono);
      text-transform: uppercase;
    }
    .waiting-text span {
      animation: blink 1.4s infinite both;
      font-size: 1.2rem;
      color: #ff4b6e;
    }
    .waiting-text span:nth-child(1) { animation-delay: 0.2s; }
    .waiting-text span:nth-child(2) { animation-delay: 0.4s; }
    .waiting-text span:nth-child(3) { animation-delay: 0.6s; }
    @keyframes blink { 0% { opacity: 0.2; } 20% { opacity: 1; } 100% { opacity: 0.2; } }
  </style>
</head>
<body>
  <div class="waiting-container">
    <div class="waiting-box fade-in">
      <div class="cyber-loader">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
      </div>
      <div class="waiting-title">SYSTEM_HOLD</div>
      <div class="waiting-text">Awaiting Admin Protocol<span>.</span><span>.</span><span>.</span></div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (!Auth.isParticipantLoggedIn()) window.location.href = 'login.html';
    
    function checkEventState() {
      const settings = Storage.getSettings();
      if (settings && settings.eventEnded) {
        window.location.href = 'terminated.html';
      } else if (settings && settings.eventStarted) {
        window.location.href = 'user-dashboard.html';
      }
    }
    
    // Check immediately
    checkEventState();
    
    // Listen for realtime sync from Firebase or LocalStorage
    window.addEventListener('firebase-synced', checkEventState);
    window.addEventListener('storage', checkEventState);
    setInterval(checkEventState, 2000); // Polling fallback
  </script>
</body>
</html>
